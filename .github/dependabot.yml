version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  # npm was absent until #218, so no update PRs were ever raised for
  # package.json / package-lock.json. Four high-severity advisories in
  # transitive packages sat open on the default branch until they were found
  # and patched by hand.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # Keep routine version churn to a single reviewable PR per week. Security
      # updates are deliberately left ungrouped so they arrive on their own and
      # stay easy to prioritise.
      dev-tooling:
        applies-to: version-updates
        patterns:
          - 'prettier'
          - '@playwright/test'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Require a human for major bumps of the two build-critical runtime
      # dependencies. glob went 10.5.0 -> 13.0.6 unattended in #223 — three
      # majors — auto-merged on a green 'Lint Fragments' check. It happened to
      # be compatible (verified: globSync still exported, same 128 matches, all
      # ten consumers load), but that was luck rather than assurance: glob is
      # used by the linter, the gallery generator, the build config sync and the
      # E2E seeders, and `ajv` backs every schema validation. A single lint job
      # is not enough evidence to land a breaking change in either.
      #
      # Minor, patch and security updates still flow automatically; only majors
      # are held back.
      - dependency-name: 'glob'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'ajv'
        update-types:
          - 'version-update:semver-major'
