name: E2E Integration Tests

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      node:
        description: 'Target Node Name (aws-1 or aws-2)'
        required: false
        default: 'aws-1'
        type: choice
        options:
          - aws-1
          - aws-2
      ldm_version:
        description: 'LDM Binary Version Tag (e.g. v2.15.16-pre.10)'
        required: false
        default: ''
        type: string
      filter:
        description: 'Test Filter Pattern (e.g. aura, dynamic-collection-slider)'
        required: false
        default: ''
        type: string

# Optimize resources by canceling redundant runs for the same branch/PR
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  LDM_VERSION: ${{ inputs.ldm_version || vars.LDM_VERSION || 'latest' }}
  LDM_NODE_TARGET: ${{ inputs.node || vars.LDM_NODE_TARGET || 'aws-1' }}

jobs:
  playwright-ldm:
    name: Playwright Tests (LDM)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-north-1' }}

      - name: Configure SSH Private Key
        run: |
          SSH_KEY="${{ secrets.EC2_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.AWS_SSH_KEY || secrets.SSH_KEY || secrets.EC2_PRIVATE_KEY || secrets.AWS_PRIVATE_KEY || secrets.LDM_SSH_KEY }}"
          if [ -n "$SSH_KEY" ]; then
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            echo "$SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            eval $(ssh-agent -s)
            ssh-add ~/.ssh/id_rsa || true
            echo "✅ SSH Private Key configured successfully."
          else
            echo "⚠️ Notice: No SSH Private Key secret found in repository secrets."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Install LDM Binary (${{ env.LDM_VERSION }})
        run: |
          if [ "${{ env.LDM_VERSION }}" = "latest" ] || [ -z "${{ env.LDM_VERSION }}" ]; then
            DOWNLOAD_URL="https://github.com/peterrichards-lr/liferay-docker-manager/releases/latest/download/ldm-linux-amd64"
          else
            DOWNLOAD_URL="https://github.com/peterrichards-lr/liferay-docker-manager/releases/download/${{ env.LDM_VERSION }}/ldm-linux-amd64"
          fi
          echo "Downloading LDM from: $DOWNLOAD_URL"
          curl -sSL -o /tmp/ldm-linux "$DOWNLOAD_URL" || curl -sSL -o /tmp/ldm-linux "https://github.com/peterrichards-lr/liferay-docker-manager/releases/download/${{ env.LDM_VERSION }}/ldm-linux"
          chmod +x /tmp/ldm-linux
          sudo mv /tmp/ldm-linux /usr/local/bin/ldm
          ldm version --no-color --no-unicode || ldm --version || true

      - name: Provide Dummy LDM License
        run: |
          mkdir -p ~/.ldm/common/
          echo "<license>Dummy License for CI</license>" > ~/.ldm/common/dummy-license.xml

      - name: Run E2E Test Suite
        env:
          LDM_NODE_TARGET: ${{ env.LDM_NODE_TARGET }}
          NODE_POWER_CONFIG_URL: ${{ vars.NODE_POWER_CONFIG_URL }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.filter }}" ]; then
            ARGS+=("-f" "${{ inputs.filter }}")
          fi
          ./scripts/test-runner.sh "${ARGS[@]}"

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-artifacts
          path: |
            e2e-tests/playwright-report/
            e2e-tests/playwright_output.log
            docs/test-results/
            e2e-tests/snapshots/
          retention-days: 7

      - name: Sleep remote target node (mandatory cleanup)
        if: always()
        run: |
          TARGET_NODE="${{ inputs.node || vars.LDM_NODE_TARGET || env.LDM_NODE_TARGET || 'aws-1' }}"
          if [ "$TARGET_NODE" != "local" ] && [ -n "$TARGET_NODE" ]; then
            ./scripts/node_power.sh sleep "$TARGET_NODE" || true
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          NODE_POWER_CONFIG_URL: ${{ vars.NODE_POWER_CONFIG_URL }}
