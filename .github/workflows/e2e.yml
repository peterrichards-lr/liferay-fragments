name: E2E Integration Tests

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      node:
        description: 'Target Node Name (aws-1 or aws-2)'
        required: false
        default: 'aws-1'
        type: choice
        options:
          - aws-1
          - aws-2
      filter:
        description: 'Test Filter Pattern (e.g. aura, dynamic-collection-slider)'
        required: false
        default: ''
        type: string

# Optimize resources by canceling redundant runs for the same branch/PR
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  LDM_VERSION: v2.15.16-pre.10
  LDM_NODE_TARGET: ${{ inputs.node || vars.LDM_NODE_TARGET || secrets.LDM_NODE_TARGET || 'aws-1' }}

jobs:
  playwright-ldm:
    name: Playwright Tests (LDM)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Install LDM Binary (${{ env.LDM_VERSION }})
        run: |
          DOWNLOAD_URL="https://github.com/peterrichards-lr/liferay-docker-manager/releases/download/${{ env.LDM_VERSION }}/ldm-linux"
          echo "Downloading LDM ${{ env.LDM_VERSION }} from: $DOWNLOAD_URL"
          wget -q -O ldm-linux "$DOWNLOAD_URL"
          chmod +x ldm-linux
          sudo mv ldm-linux /usr/local/bin/ldm
          ldm version --no-color --no-unicode

      - name: Provide Dummy LDM License
        run: |
          mkdir -p ~/.ldm/common/
          echo "<license>Dummy License for CI</license>" > ~/.ldm/common/dummy-license.xml

      - name: Run E2E Test Suite
        env:
          LDM_NODE_TARGET: ${{ env.LDM_NODE_TARGET }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.filter }}" ]; then
            ARGS+=("-f" "${{ inputs.filter }}")
          fi
          ./scripts/test-runner.sh "${ARGS[@]}"

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-artifacts
          path: |
            e2e-tests/playwright-report/
            e2e-tests/playwright_output.log
            docs/test-results/
            e2e-tests/snapshots/
          retention-days: 7
