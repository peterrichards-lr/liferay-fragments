name: Target Node Cost & Power Control

on:
  schedule:
    - cron: '0 * * * *'  # Hourly schedule enforcement
  workflow_dispatch:
    inputs:
      action:
        description: 'Action (status|wake|sleep|enforce)'
        required: true
        default: 'status'
        type: choice
        options:
          - status
          - wake
          - sleep
          - enforce
      node:
        description: 'Target Node Name (aws-1 or aws-2)'
        required: false
        default: 'aws-1'
        type: choice
        options:
          - aws-1
          - aws-2
      ttl:
        description: 'Wake Duration (e.g. 2h, 4h, 30m)'
        required: false
        default: '2h'

jobs:
  power-management:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-north-1' }}
      - name: Configure SSH Private Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.LDM_TARGET_SSH_KEY || secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            GlobalKnownHostsFile /dev/null
            ServerAliveInterval 15
            ServerAliveCountMax 10
          EOF
          chmod 600 ~/.ssh/config
      - name: Install LDM Binary
        run: |
          echo "📥 Downloading LDM binary (ldm-linux) from liferay-docker-manager..."
          curl -sSL -f "https://github.com/peterrichards-lr/liferay-docker-manager/releases/latest/download/ldm-linux" -o /tmp/ldm || true
          if [ -s /tmp/ldm ]; then
            sudo mv /tmp/ldm /usr/local/bin/ldm
            sudo chmod +x /usr/local/bin/ldm
            ldm version --no-color --no-unicode || ldm --version || true
          fi
      - env:
          NODE_POWER_CONFIG_URL: ${{ vars.NODE_POWER_CONFIG_URL }}
        run: |
          TARGET_NODE="${{ inputs.node || vars.LDM_NODE_TARGET || 'aws-1' }}"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 scripts/manage_target_nodes.py enforce
          else
            case "${{ inputs.action }}" in
              status) python3 scripts/manage_target_nodes.py status ;;
              wake) python3 scripts/manage_target_nodes.py wake "$TARGET_NODE" --ttl "${{ inputs.ttl }}" ;;
              sleep) python3 scripts/manage_target_nodes.py sleep "$TARGET_NODE" ;;
              enforce) python3 scripts/manage_target_nodes.py enforce ;;
            esac
          fi
